version: v2
inputs:
  - directory: api
    paths:
      - api/commons/errno
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11"]
    out: api
    opt: paths=source_relative
  - local: ["go", "run", "github.com/go-kratos/kratos/cmd/protoc-gen-go-errors/v3@v3.0.0-20261026152050-dd0fb7df1e32"]
    out: api
    opt: paths=source_relative
