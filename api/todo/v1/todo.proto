syntax = "proto3";

package todo.v1;

import "buf/validate/validate.proto";
import "gnostic/openapi/v3/annotations.proto";
import "google/api/annotations.proto";
import "google/api/field_behavior.proto";

option go_package = "github.com/go-kratos/kratos-layout/api/todo/v1;v1";

// Todo Service
service TodoService {
  rpc CreateTodo(CreateTodoRequest) returns (CreateTodoReply) {
    option (google.api.http) = {
      post: "/service/v1/todos"
      body: "*"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Create Todo"
    };
  }
  rpc ListTodo(ListTodoRequest) returns (ListTodoReply) {
    option (google.api.http) = {
      get: "/service/v1/todos"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Todo List"
    };
  }
  rpc GetTodo(GetTodoRequest) returns (GetTodoReply) {
    option (google.api.http) = {
      get: "/service/v1/todos/{id}"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Get Todo Info"
    };
  }
  rpc UpdateTodo(UpdateTodoRequest) returns (UpdateTodoReply) {
    option (google.api.http) = {
      put: "/service/v1/todos/{id}"
      body: "form"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Update Todo"
    };
  }
  rpc DeleteTodo(DeleteTodoRequest) returns (DeleteTodoReply) {
    option (google.api.http) = {
      delete: "/service/v1/todos/{id}"
    };
    option (gnostic.openapi.v3.operation) = {
      summary: "Delete Todo"
    };
  }
}

message CreateTodoRequest {
  string name = 2 [
    (google.api.field_behavior)   = REQUIRED,
    (gnostic.openapi.v3.property) = { description: "名称" },
    (buf.validate.field).cel      = {
      id: "name"
      expression: "this.matches('^[\\\\s\\\\x{000B}\\\\x{0085}\\\\p{Z}]*$') ? 'name 不得为空或仅包含空白字符' : size(this) > 20 ? 'name 长度不得超过 20 个字符' : ''"
    }
  ];
}
message CreateTodoReply {}

message ListTodoRequest {
  option (buf.validate.message).cel = {
    id: "list_todo.offset.range"
    expression: "((this.page == 0 ? 1 : this.page) - 1) * (this.page_size == 0 ? 20 : this.page_size) <= 2147483647 ? '' : '分页偏移量不得超过 2147483647'"
  };
  // 页码
  int32 page = 1 [
    (buf.validate.field).cel = { id: "list_todo.page.non_negative" expression: "this >= 0 ? '' : 'page 不得小于 0'" }
  ];
  // 行数
  int32 page_size = 2 [(buf.validate.field).cel = {
    id: "list_todo.page_size.range"
    expression: "this >= 0 && this <= 100 ? '' : 'page_size 必须在 0 到 100 之间'"
  }];
  // 排序方式：asc-升序，desc-降序
  string order = 3 [(buf.validate.field).cel = {
    id: "list_todo.order.allowed"
    expression: "this in ['', 'asc', 'desc'] ? '' : 'order 仅支持 asc 或 desc'"
  }];
  // 排序字段
  string sort = 4 [(buf.validate.field).cel = {
    id: "list_todo.sort.allowed"
    expression: "this == '' || this.matches('^ *(id|name|created_at|updated_at) *$') ? '' : 'sort 仅支持 id、name、created_at 或 updated_at'"
  }];
  // 过滤条件表达式，参见：https://google.aip.dev/160
  string filter = 5;
}
message ListTodoReply {
  repeated Todo data  = 1;
  int64         total = 2;
}

message GetTodoRequest {
  int32 id = 1
      [(buf.validate.field).cel = { id: "get_todo.id.positive" expression: "this > 0 ? '' : 'id 必须大于 0'" }];
}
message GetTodoReply {
  Todo data = 1;
}

message UpdateTodoRequest {
  option (buf.validate.message).cel = {
    id: "update_todo.form.present"
    expression: "has(this.form) ? '' : 'form 不得缺失'"
  };
  message Form {
    string name = 2 [
      (google.api.field_behavior)   = REQUIRED,
      (gnostic.openapi.v3.property) = { description: "名称" },
      (buf.validate.field).cel      = {
        id: "name"
        expression: "this.matches('^[\\\\s\\\\x{000B}\\\\x{0085}\\\\p{Z}]*$') ? 'name 不得为空或仅包含空白字符' : size(this) > 20 ? 'name 长度不得超过 20 个字符' : ''"
      }
    ];
  }
  int32 id = 1
      [(buf.validate.field).cel = { id: "update_todo.id.positive" expression: "this > 0 ? '' : 'id 必须大于 0'" }];
  Form form = 2;
}
message UpdateTodoReply {}

message DeleteTodoRequest {
  int32 id = 1
      [(buf.validate.field).cel = { id: "delete_todo.id.positive" expression: "this > 0 ? '' : 'id 必须大于 0'" }];
}
message DeleteTodoReply {}

message Todo {
  int32  id         = 1 [(gnostic.openapi.v3.property) = { description: "主键 id" }];
  string name       = 2 [(gnostic.openapi.v3.property) = { description: "名称" }];
  string created_at = 3 [(gnostic.openapi.v3.property) = { description: "创建时间" }];
  string updated_at = 4 [(gnostic.openapi.v3.property) = { description: "更新时间" }];
}
